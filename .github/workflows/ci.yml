name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/mux

      - name: Cross-compile (Linux arm64)
        run: GOARCH=arm64 go build ./cmd/mux

      # 유닛 테스트는 tmux 를 목으로 대신하므로, tmux 자신의 동작이 바뀌면
      # 아무것도 안 깨진 채로 mux 만 이상해진다. 러너 이미지의 tmux 가 올라갈
      # 때 그것이 드러나는 자리가 여기다.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Check tmux assumptions
        run: ./scripts/tmux-assumptions.sh

      # 진짜 tmux 위에서 사용자 눈에 보이는 동작(창 크기, 패널 폭이 모든 세션에 퍼지는지,
      # 클라이언트 이동)을 본다. 한동안 아무도 돌리지 않아, 원칙을 바꾼 커밋(aee4d94)이
      # 시나리오를 깨뜨린 채 들어갔고 맞춤 창의 드래그가 저장되지 않는 버그도 못 잡았다.
      - name: E2E (isolated tmux)
        run: make e2e
